<app-admin-navbar></app-admin-navbar>

<div class="order-history-container">
  <h2 class="text-center mb-4">Admin Order History</h2>

  <!-- Search Filters -->
  <div class="search-filters mb-4">
    <label for="search" class="search-label">Search:</label>
    <input type="text" id="search" class="form-control search-input" [(ngModel)]="searchText" placeholder="Search by Name, Booking ID, Service, Sub-Service" />
  </div>

  <!-- Orders Table -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Booking ID</th>
        <th>Customer Name</th>
        <th>Service</th>
        <th>Sub-Service</th>
        <th>Date</th>
        <th>Vendor</th>
        <th>Amount</th>
        <th >Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let booking of filteredBookings()">
        <td>{{ booking.id }}</td>
        <td>{{ booking.customerName }}</td>
        <td>{{ booking.service }}</td>
        <td>{{ booking.subService }}</td>
        <td>{{ booking.date | date: 'shortDate' }}</td>
        <td>{{ booking.vendor }}</td>
        <td>{{ booking.amount }}</td>
        <td >
          <button 
            class="btn btn-danger delete-btn" 
            (click)="deleteBooking(booking.id)">
            Delete
          </button>
        </td>
      </tr>
      <tr *ngIf="filteredBookings().length === 0">
        <td colspan="8" class="text-center">No bookings found</td>
      </tr>
    </tbody>
  </table>
</div>
